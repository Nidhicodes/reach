[project]
name = "reach"
version = "0.1.0"
description = "Reach: find the attack paths AI agents open up, and the smallest permission cut that closes them. Built on FalkorDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb==1.8.0",
    "falkordblite==0.10.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach"]
