# Render Blueprint: New -> Blueprint -> pick this repo. Secrets marked sync:false are
# entered in the Render dashboard, never committed.
# Region: Render cannot move an existing service, so this matches the live one. The DB is
# in ap-south-1; graphs are seeded once in the background and kept across restarts, so
# only the first seed pays the cross-region round trips.
services:
  - type: web
    name: reach
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/config
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_TLS
        value: "0"
      # Real-LLM Ask tab stays off on the public demo. To enable: add REACH_LLM_BASE_URL and
      # REACH_LLM_API_KEY in the dashboard and raise this budget (e.g. 30 calls/hour).
      - key: REACH_PUBLIC_LLM_PER_HOUR
        value: "0"
